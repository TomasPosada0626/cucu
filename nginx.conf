worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream django_app {
        server django:8000;
    }

    upstream payment_service {
        server payment-service:8080;
    }

    upstream geo_service {
        server geo-service:8081;
    }

    upstream notifications_service {
        server notifications-service:8082;
    }

    upstream auth_service {
        server auth-service:8083;
    }

    upstream market_service {
        server market-service:8084;
    }

    upstream support_service {
        server support-service:8085;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 20m;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        location = /api/v1 {
            return 301 /api/v1/;
        }

        location = /api/v2/payments {
            proxy_pass http://payment_service;
        }

        location = /api/v2/pagos {
            return 301 /api/v2/payments;
        }

        location /api/v2/payments {
            proxy_pass http://payment_service;
        }

        location /api/v2/geocode {
            proxy_pass http://geo_service;
        }

        location /api/v2/route {
            proxy_pass http://geo_service;
        }

        location /api/v3/notifications {
            proxy_pass http://notifications_service;
        }

        location /api/v3/auth {
            proxy_pass http://auth_service;
        }

        location /api/v3/publications {
            proxy_pass http://market_service;
        }

        location /api/v3/orders {
            proxy_pass http://market_service;
        }

        location /api/v3/ratings {
            proxy_pass http://support_service;
        }

        location /api/v3/trust/ {
            proxy_pass http://support_service;
        }

        location /api/v3/transactions {
            proxy_pass http://support_service;
        }

        location /api/v2/pagos/ {
            rewrite ^/api/v2/pagos/(.*)$ /api/v2/payments/$1 break;
            proxy_pass http://payment_service;
        }

        location /api/v1/ {
            rewrite ^/api/v1/(.*)$ /api/$1 break;
            proxy_pass http://django_app;
        }

        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /media/ {
            alias /app/media/;
            expires 7d;
            add_header Cache-Control "public";
        }

        location / {
            proxy_pass http://django_app;
        }
    }
}