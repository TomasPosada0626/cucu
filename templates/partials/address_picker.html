{% load i18n %}
<style>
  .addr-picker-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 17, 23, 0.45);
    z-index: 3000;
    display: none;
    align-items: flex-end;
    justify-content: center;
    padding: 0;
  }

  .addr-picker-overlay.open { display: flex; }

  .addr-picker-modal {
    width: min(560px, 100%);
    max-height: 88vh;
    overflow-y: auto;
    background: #fdf8f3;
    border-radius: 24px 24px 0 0;
    padding: 20px;
    box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.25);
  }

  @media (min-width: 640px) {
    .addr-picker-overlay { align-items: center; padding: 24px; }
    .addr-picker-modal { border-radius: 24px; }
  }

  .addr-picker-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .addr-picker-head h3 {
    margin: 0;
    font-family: 'Outfit', sans-serif;
    font-size: 19px;
  }

  .addr-picker-close {
    border: 0;
    background: rgba(31, 36, 48, 0.06);
    width: 32px;
    height: 32px;
    border-radius: 999px;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
  }

  .addr-picker-current {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-radius: 16px;
    border: 1px solid rgba(255, 106, 26, 0.25);
    background: rgba(255, 106, 26, 0.06);
    color: #ff6a1a;
    font-weight: 800;
    cursor: pointer;
    margin-bottom: 14px;
  }

  .addr-picker-list {
    display: grid;
    gap: 10px;
    margin-bottom: 14px;
  }

  .addr-picker-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 16px;
    border-radius: 16px;
    border: 1px solid rgba(31, 36, 48, 0.1);
    background: #fff;
    cursor: pointer;
  }

  .addr-picker-item:hover { border-color: rgba(255, 106, 26, 0.35); }

  .addr-picker-item .info { min-width: 0; }
  .addr-picker-item .nombre { font-weight: 800; font-size: 14px; }
  .addr-picker-item .texto,
  .addr-picker-item .detalles {
    color: #6f7483;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .addr-picker-item .del {
    flex: 0 0 auto;
    border: 0;
    background: transparent;
    color: #a63c3c;
    font-size: 18px;
    cursor: pointer;
    padding: 4px 8px;
  }

  .addr-picker-empty { color: #6f7483; font-size: 13px; padding: 8px 0; }

  .addr-picker-add-toggle {
    width: 100%;
    padding: 12px;
    border-radius: 16px;
    border: 1px dashed rgba(31, 36, 48, 0.25);
    background: transparent;
    font-weight: 800;
    cursor: pointer;
  }

  .addr-picker-form { display: grid; gap: 10px; margin-top: 10px; }
  .addr-picker-form[hidden] { display: none; }

  .addr-picker-form input,
  .addr-picker-form textarea {
    width: 100%;
    padding: 10px 14px;
    border-radius: 14px;
    border: 1px solid rgba(31, 36, 48, 0.14);
    font: inherit;
  }

  .addr-picker-suggestions {
    display: none;
    gap: 4px;
    padding: 6px;
    border-radius: 18px;
    border: 1px solid rgba(31, 36, 48, 0.1);
    background: #fff;
    box-shadow: 0 14px 34px rgba(36, 38, 45, 0.08);
    max-height: 240px;
    overflow-y: auto;
  }

  .addr-picker-suggestions.is-open { display: grid; }

  .addr-picker-suggestion {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    width: 100%;
    text-align: left;
    padding: 10px 10px;
    border-radius: 14px;
    border: 0;
    background: transparent;
    cursor: pointer;
    color: #1f2430;
  }

  .addr-picker-suggestion:hover,
  .addr-picker-suggestion:focus {
    outline: none;
    background: rgba(31, 36, 48, 0.04);
  }

  .addr-picker-suggestion svg {
    flex: 0 0 auto;
    width: 18px;
    height: 18px;
    margin-top: 1px;
    color: #ff6a1a;
  }

  .addr-picker-suggestion .texts { min-width: 0; }

  .addr-picker-suggestion .title {
    display: block;
    font-weight: 800;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .addr-picker-suggestion .subtitle {
    display: block;
    color: #6f7483;
    font-size: 12px;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .addr-picker-loading {
    padding: 10px 12px;
    color: #6f7483;
    font-size: 12px;
  }

  .addr-picker-form .save-btn {
    padding: 12px;
    border-radius: 14px;
    border: 0;
    background: linear-gradient(135deg, #ff6a1a, #f25c10);
    color: #fff;
    font-weight: 800;
    cursor: pointer;
  }

  .addr-picker-hint { font-size: 12px; color: #6f7483; }
</style>

<div class="addr-picker-overlay" id="addrPickerOverlay">
  <div class="addr-picker-modal">
    <div class="addr-picker-head">
      <h3>{% trans "Selecciona una direccion" %}</h3>
      <button class="addr-picker-close" id="addrPickerClose" type="button" aria-label="{% trans 'Cerrar' %}">&times;</button>
    </div>

    <button class="addr-picker-current" id="addrPickerUseCurrent" type="button">
      📍 {% trans "Usar mi ubicacion actual" %}
    </button>

    <div class="addr-picker-list" id="addrPickerList"></div>

    <button class="addr-picker-add-toggle" id="addrPickerAddToggle" type="button">
      + {% trans "Agregar nueva direccion" %}
    </button>

    <div class="addr-picker-form" id="addrPickerForm" hidden>
      <input id="addrPickerSearchInput" placeholder="{% trans 'Busca tu direccion' %}" autocomplete="off" aria-label="{% trans 'Busca tu direccion' %}" />
      <div class="addr-picker-suggestions" id="addrPickerSuggestions"></div>
      <input id="addrPickerNombreInput" placeholder="{% trans 'Nombre de esta direccion (ej: Casa, Trabajo)' %}" aria-label="{% trans 'Nombre de esta direccion' %}" />
      <textarea id="addrPickerDetallesInput" rows="2" placeholder="{% trans 'Apto, bloque, porteria, referencias (opcional)' %}" aria-label="{% trans 'Referencias adicionales' %}"></textarea>
      <div class="addr-picker-hint" id="addrPickerSelectedHint"></div>
      <button class="save-btn" id="addrPickerSaveBtn" type="button">{% trans "Guardar direccion" %}</button>
    </div>
  </div>
</div>

<script>
  window.CUCUAddressPicker = (function () {
    const TXT_NO_ADDRESSES = '{% trans "Todavia no tienes direcciones guardadas." %}';
    const TXT_LOCATING = '{% trans "Ubicando..." %}';
    const TXT_LOCATE_ERROR = '{% trans "No pudimos obtener tu ubicacion." %}';
    const TXT_NAME_REQUIRED = '{% trans "Ponle un nombre a esta direccion." %}';
    const TXT_PICK_SUGGESTION = '{% trans "Elige una direccion de la lista de sugerencias." %}';
    const TXT_DELETE_CONFIRM = '{% trans "Eliminar esta direccion?" %}';

    const overlay = document.getElementById('addrPickerOverlay');
    const listEl = document.getElementById('addrPickerList');
    const closeBtn = document.getElementById('addrPickerClose');
    const useCurrentBtn = document.getElementById('addrPickerUseCurrent');
    const addToggleBtn = document.getElementById('addrPickerAddToggle');
    const formEl = document.getElementById('addrPickerForm');
    const searchInput = document.getElementById('addrPickerSearchInput');
    const suggestionsEl = document.getElementById('addrPickerSuggestions');
    const nombreInput = document.getElementById('addrPickerNombreInput');
    const detallesInput = document.getElementById('addrPickerDetallesInput');
    const selectedHint = document.getElementById('addrPickerSelectedHint');
    const saveBtn = document.getElementById('addrPickerSaveBtn');

    let onSelectCallback = null;
    let pendingSelection = null;
    let suggestionTimer = null;

    async function pickerFetch(url, options = {}) {
      let token = localStorage.getItem('token');
      const doFetch = (t) => fetch(url, {
        ...options,
        headers: { ...(options.headers || {}), Authorization: `Bearer ${t}` },
      });

      let response = await doFetch(token);
      if (response.status === 401) {
        const refresh = localStorage.getItem('refresh');
        if (refresh) {
          const refreshRes = await fetch('/api/token/refresh', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ refresh }),
          });
          const refreshPayload = await refreshRes.json().catch(() => null);
          if (refreshRes.ok && refreshPayload?.access) {
            localStorage.setItem('token', refreshPayload.access);
            token = refreshPayload.access;
            response = await doFetch(token);
          }
        }
      }
      const payload = await response.json().catch(() => null);
      return { response, payload };
    }

    function escapeHtml(value) {
      return String(value || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    async function loadList() {
      listEl.innerHTML = `<div class="addr-picker-empty">${TXT_LOCATING}</div>`;
      const { response, payload } = await pickerFetch('/api/direcciones');
      if (!response.ok || !Array.isArray(payload)) {
        listEl.innerHTML = `<div class="addr-picker-empty">${TXT_NO_ADDRESSES}</div>`;
        return;
      }
      if (!payload.length) {
        listEl.innerHTML = `<div class="addr-picker-empty">${TXT_NO_ADDRESSES}</div>`;
        return;
      }
      listEl.innerHTML = payload.map((addr) => `
        <div class="addr-picker-item" data-id="${addr.id}">
          <div class="info">
            <div class="nombre">${escapeHtml(addr.nombre)}</div>
            <div class="texto">${escapeHtml(addr.direccion_texto)}</div>
            ${addr.detalles ? `<div class="detalles">${escapeHtml(addr.detalles)}</div>` : ''}
          </div>
          <button class="del" data-del="${addr.id}" type="button" aria-label="Eliminar">&times;</button>
        </div>
      `).join('');

      listEl.querySelectorAll('.addr-picker-item').forEach((item) => {
        item.addEventListener('click', (event) => {
          if (event.target.closest('.del')) return;
          const id = item.dataset.id;
          const addr = payload.find((a) => String(a.id) === String(id));
          if (addr) selectAddress(addr);
        });
      });
      listEl.querySelectorAll('.del').forEach((btn) => {
        btn.addEventListener('click', async (event) => {
          event.stopPropagation();
          if (!confirm(TXT_DELETE_CONFIRM)) return;
          await pickerFetch(`/api/direcciones/${btn.dataset.del}`, { method: 'DELETE' });
          loadList();
        });
      });
    }

    function selectAddress(addr) {
      close();
      if (typeof onSelectCallback === 'function') {
        onSelectCallback({
          nombre: addr.nombre,
          direccion_texto: addr.direccion_texto,
          detalles: addr.detalles || '',
          latitud: Number(addr.latitud),
          longitud: Number(addr.longitud),
        });
      }
    }

    async function useCurrentLocation() {
      if (!navigator.geolocation) {
        alert(TXT_LOCATE_ERROR);
        return;
      }
      useCurrentBtn.textContent = `📍 ${TXT_LOCATING}`;
      navigator.geolocation.getCurrentPosition(async (pos) => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        const url = new URL('/api/geocode/reverse', window.location.origin);
        url.searchParams.set('latitud', String(lat));
        url.searchParams.set('longitud', String(lng));
        const res = await fetch(url).catch(() => null);
        const payload = await res?.json().catch(() => null);
        useCurrentBtn.textContent = `📍 Usar mi ubicacion actual`;
        if (!res?.ok || !payload) {
          alert(TXT_LOCATE_ERROR);
          return;
        }
        openAddForm({
          direccion_texto: payload.direccion_texto,
          latitud: Number(lat.toFixed(6)),
          longitud: Number(lng.toFixed(6)),
        });
      }, () => {
        useCurrentBtn.textContent = `📍 Usar mi ubicacion actual`;
        alert(TXT_LOCATE_ERROR);
      }, { enableHighAccuracy: true, timeout: 8000 });
    }

    function openAddForm(prefill) {
      formEl.hidden = false;
      addToggleBtn.hidden = true;
      if (prefill) {
        searchInput.value = prefill.direccion_texto || '';
        pendingSelection = prefill;
        selectedHint.textContent = `✓ ${prefill.direccion_texto}`;
      }
      nombreInput.focus();
    }

    function closeAddForm() {
      formEl.hidden = true;
      addToggleBtn.hidden = false;
      searchInput.value = '';
      nombreInput.value = '';
      detallesInput.value = '';
      suggestionsEl.classList.remove('is-open');
      suggestionsEl.innerHTML = '';
      selectedHint.textContent = '';
      pendingSelection = null;
    }

    async function fetchSuggestions(query) {
      const url = new URL('/api/geocode/suggest', window.location.origin);
      url.searchParams.set('q', query);
      url.searchParams.set('limit', '5');
      const res = await fetch(url).catch(() => null);
      const payload = await res?.json().catch(() => null);
      return Array.isArray(payload?.items) ? payload.items : [];
    }

    searchInput?.addEventListener('input', () => {
      pendingSelection = null;
      selectedHint.textContent = '';
      const query = searchInput.value.trim();
      window.clearTimeout(suggestionTimer);
      if (query.length < 4) {
        suggestionsEl.classList.remove('is-open');
        suggestionsEl.innerHTML = '';
        return;
      }
      suggestionTimer = window.setTimeout(async () => {
        const items = await fetchSuggestions(query);
        suggestionsEl.classList.toggle('is-open', items.length > 0);
        suggestionsEl.innerHTML = items.map((it, idx) => `
          <button class="addr-picker-suggestion" type="button" data-idx="${idx}">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21s6-5.3 6-11a6 6 0 1 0-12 0c0 5.7 6 11 6 11Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 13.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z" stroke="currentColor" stroke-width="1.8"/></svg>
            <span class="texts">
              <span class="title">${escapeHtml(it.primary || it.display_name)}</span>
              <span class="subtitle">${escapeHtml(it.secondary || it.display_name)}</span>
            </span>
          </button>
        `).join('');
        suggestionsEl.querySelectorAll('.addr-picker-suggestion').forEach((btn) => {
          btn.addEventListener('click', () => {
            const item = items[Number(btn.dataset.idx)];
            if (!item) return;
            searchInput.value = item.primary || item.display_name;
            suggestionsEl.classList.remove('is-open');
            suggestionsEl.innerHTML = '';
            pendingSelection = {
              direccion_texto: item.primary || item.display_name,
              latitud: Number(Number(item.latitud).toFixed(6)),
              longitud: Number(Number(item.longitud).toFixed(6)),
            };
            selectedHint.textContent = `✓ ${searchInput.value}`;
          });
        });
      }, 300);
    });

    saveBtn?.addEventListener('click', async () => {
      const nombre = nombreInput.value.trim();
      if (!nombre) {
        alert(TXT_NAME_REQUIRED);
        return;
      }
      if (!pendingSelection) {
        alert(TXT_PICK_SUGGESTION);
        return;
      }
      saveBtn.disabled = true;
      const { response, payload } = await pickerFetch('/api/direcciones', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          nombre,
          direccion_texto: pendingSelection.direccion_texto,
          detalles: detallesInput.value.trim(),
          latitud: Number(Number(pendingSelection.latitud).toFixed(6)),
          longitud: Number(Number(pendingSelection.longitud).toFixed(6)),
        }),
      });
      saveBtn.disabled = false;
      if (!response.ok) {
        let message = 'No se pudo guardar la direccion.';
        if (payload && typeof payload === 'object') {
          for (const value of Object.values(payload)) {
            if (typeof value === 'string' && value.trim()) { message = value.trim(); break; }
            if (Array.isArray(value) && typeof value[0] === 'string' && value[0].trim()) { message = value[0].trim(); break; }
          }
        }
        alert(message);
        return;
      }
      closeAddForm();
      await loadList();
      selectAddress(payload);
    });

    addToggleBtn?.addEventListener('click', () => openAddForm());
    useCurrentBtn?.addEventListener('click', useCurrentLocation);
    closeBtn?.addEventListener('click', close);
    overlay?.addEventListener('click', (event) => {
      if (event.target === overlay) close();
    });

    function open(onSelect) {
      onSelectCallback = onSelect;
      closeAddForm();
      overlay.classList.add('open');
      loadList();
    }

    function close() {
      overlay.classList.remove('open');
    }

    return { open, close };
  })();
</script>
