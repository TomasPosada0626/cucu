name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.3
      - run: ruff check .
      - run: pip install mypy==2.3.1
      - run: mypy

  django-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cucu
          POSTGRES_USER: cucu
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cucu -d cucu"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-test-secret-key
      ALLOWED_HOSTS: localhost,127.0.0.1
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      POSTGRES_DB: cucu
      POSTGRES_USER: cucu
      POSTGRES_PASSWORD: ci-test-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      # Playwright's sync API runs its own event loop in a background thread,
      # which trips Django's async-context check on DB access from the
      # LiveServerTestCase's accessibility tests - known false positive for
      # this exact combination, not a real async DB access.
      DJANGO_ALLOW_ASYNC_UNSAFE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: coverage run manage.py test
      - run: coverage report
      - run: python manage.py spectacular --validate

  microservice-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth_microservice
          - geo_microservice
          - market_microservice
          - notifications_microservice
          - payment_microservice
          - support_microservice
    # Only auth_microservice needs Postgres so far (migrated off SQLite as
    # the pilot for the other 5) - an idle service container costs nothing
    # for the rest of the matrix, and this is the shape the other 5 will
    # reuse once they migrate too.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cucu
          POSTGRES_USER: cucu
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cucu -d cucu"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: cucu
      POSTGRES_USER: cucu
      POSTGRES_PASSWORD: ci-test-password
      AUTH_JWT_SECRET: ci-test-jwt-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ${{ matrix.service }}/requirements.txt
      - run: cd ${{ matrix.service }} && pytest

  dependency-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        requirements:
          - requirements.txt
          - auth_microservice/requirements.txt
          - geo_microservice/requirements.txt
          - market_microservice/requirements.txt
          - notifications_microservice/requirements.txt
          - payment_microservice/requirements.txt
          - support_microservice/requirements.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r ${{ matrix.requirements }}

  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, django-tests, microservice-tests, dependency-audit]
    steps:
      # deploy.sh runs entirely on the EC2 host and already handles its own
      # rollback on a failed health check - this job's only job is to SSH in
      # and run it after every check above is green.
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: cd ~/cucu && ./scripts/deploy.sh
