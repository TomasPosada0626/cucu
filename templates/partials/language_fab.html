{% load i18n %}
<style>
  .language-fab {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 1200;
    margin: 0;
  }

  .language-fab-toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
    padding: 0 10px;
    border-radius: 999px;
    border: 1px solid rgba(31, 36, 48, 0.14);
    background: rgba(255, 255, 255, 0.95);
    color: #1f2430;
    font-weight: 800;
    font-size: 12px;
    letter-spacing: 0.02em;
    backdrop-filter: blur(8px);
    cursor: pointer;
    user-select: none;
  }

  .language-fab-toggle input {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
    pointer-events: none;
  }

  .language-fab-track {
    position: relative;
    width: 34px;
    height: 20px;
    border-radius: 999px;
    background: #e8e3dc;
    transition: background 160ms ease;
  }

  .language-fab-track::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 2px 6px rgba(31, 36, 48, 0.2);
    transition: transform 160ms ease;
  }

  .language-fab-toggle input:checked + .language-fab-track {
    background: rgba(255, 106, 26, 0.4);
  }

  .language-fab-toggle input:checked + .language-fab-track::after {
    transform: translateX(14px);
  }
</style>
<form class="language-fab" action="/i18n/setlang/" method="post">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path|default:'/' }}" />
  {% get_current_language as CURRENT_LANGUAGE %}
  <input type="hidden" name="language" value="{% if CURRENT_LANGUAGE == 'en' %}en{% else %}es{% endif %}" />
  <label class="language-fab-toggle" aria-label="{% trans 'Idioma' %}">
    <span>ES</span>
    <input type="checkbox" {% if CURRENT_LANGUAGE == 'en' %}checked{% endif %} onchange="this.form.language.value = this.checked ? 'en' : 'es'; this.form.submit();" />
    <span class="language-fab-track" aria-hidden="true"></span>
    <span>EN</span>
  </label>
</form>
