services:
  nginx:
    image: nginx:1.27-alpine
    container_name: cucu-nginx
    depends_on:
      - django
      - payment-service
      - geo-service
      - notifications-service
      - auth-service
      - market-service
      - support-service
      - redis
      - rabbitmq
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - staticfiles_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - ./certbot-webroot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cucu-django
    command: gunicorn --bind 0.0.0.0:8000 --workers 4 --worker-class gthread --threads 4 --timeout 30 config.wsgi:application
    environment:
      # Lee de .env - nunca hardcodear True acá. El django-server que enfrenta
      # a internet corriendo en debug expone tracebacks completos, queries SQL
      # y rutas del sistema a cualquier visitante en un 500 sin manejar.
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - DJANGO_SETTINGS_MODULE=config.settings
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SECURE_HSTS_SECONDS=${SECURE_HSTS_SECONDS:-0}
      - GEO_SERVICE_URL=http://geo-service:8081
      - NOTIFICATIONS_SERVICE_URL=http://notifications-service:8082
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - PYTHONUNBUFFERED=1
      - POSTGRES_DB=${POSTGRES_DB:-cucu}
      - POSTGRES_USER=${POSTGRES_USER:-cucu}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - staticfiles_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"
    healthcheck:
      # A diferencia del socket-connect anterior (solo confirma que el puerto
      # responde), /api/health/ valida que Django puede hablar con la DB y
      # con Redis - un proceso colgado con la DB caida ahora se marca unhealthy.
      test: ["CMD", "python", "-c", "import urllib.request as r; r.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  geo-service:
    build:
      context: ./geo_microservice
      dockerfile: Dockerfile
    container_name: cucu-geo-service
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - SENTRY_DSN=${SENTRY_DSN:-}
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8081)); s.close()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  payment-service:
    build:
      context: ./payment_microservice
      dockerfile: Dockerfile
    container_name: cucu-payment-service
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - SENTRY_DSN=${SENTRY_DSN:-}
      - POSTGRES_USER=${POSTGRES_USER:-cucu}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-cucu}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_PAYMENTS_QUEUE=payments.events
    depends_on:
      rabbitmq:
        condition: service_started
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8080)); s.close()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  notifications-service:
    build:
      context: ./notifications_microservice
      dockerfile: Dockerfile
    container_name: cucu-notifications-service
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - SENTRY_DSN=${SENTRY_DSN:-}
      - POSTGRES_USER=${POSTGRES_USER:-cucu}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-cucu}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_PAYMENTS_QUEUE=payments.events
    depends_on:
      rabbitmq:
        condition: service_started
      postgres:
        condition: service_healthy
    expose:
      - "8082"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8082)); s.close()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  auth-service:
    build:
      context: ./auth_microservice
      dockerfile: Dockerfile
    container_name: cucu-auth-service
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - SENTRY_DSN=${SENTRY_DSN:-}
      - POSTGRES_USER=${POSTGRES_USER:-cucu}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-cucu}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET}
      - AUTH_ACCESS_TOKEN_TTL_MINUTES=${AUTH_ACCESS_TOKEN_TTL_MINUTES:-15}
      - AUTH_REFRESH_TOKEN_TTL_DAYS=${AUTH_REFRESH_TOKEN_TTL_DAYS:-30}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8083"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8083)); s.close()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  market-service:
    build:
      context: ./market_microservice
      dockerfile: Dockerfile
    container_name: cucu-market-service
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - SENTRY_DSN=${SENTRY_DSN:-}
      - MARKET_DATABASE_PATH=/app/data/market.db
    volumes:
      - market_data:/app/data
    expose:
      - "8084"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8084)); s.close()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  support-service:
    build:
      context: ./support_microservice
      dockerfile: Dockerfile
    container_name: cucu-support-service
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - SENTRY_DSN=${SENTRY_DSN:-}
      - POSTGRES_USER=${POSTGRES_USER:-cucu}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-cucu}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8085"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8085)); s.close()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cucu-celery-worker
    command: celery -A config worker --loglevel=info
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - DJANGO_SETTINGS_MODULE=config.settings
      - GEO_SERVICE_URL=http://geo-service:8081
      - NOTIFICATIONS_SERVICE_URL=http://notifications-service:8082
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - PYTHONUNBUFFERED=1
      - SENTRY_DSN=${SENTRY_DSN:-}
      - POSTGRES_DB=${POSTGRES_DB:-cucu}
      - POSTGRES_USER=${POSTGRES_USER:-cucu}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      django:
        condition: service_started
    volumes:
      - .:/app
    restart: unless-stopped

  notifications-worker:
    build:
      context: ./notifications_microservice
      dockerfile: Dockerfile
    container_name: cucu-notifications-worker
    command: python -m app.worker
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - SENTRY_DSN=${SENTRY_DSN:-}
      - POSTGRES_USER=${POSTGRES_USER:-cucu}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-cucu}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_PAYMENTS_QUEUE=payments.events
    depends_on:
      rabbitmq:
        condition: service_started
      notifications-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: cucu-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    expose:
      - "5672"
      - "15672"
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cucu-redis
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: cucu-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-cucu}
      - POSTGRES_USER=${POSTGRES_USER:-cucu}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cucu} -d ${POSTGRES_DB:-cucu}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  market_data:
  staticfiles_volume:
  media_volume:
