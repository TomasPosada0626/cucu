name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.3
      - run: ruff check .
      - run: pip install mypy==2.3.1
      - run: mypy

  django-tests:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-secret-key
      ALLOWED_HOSTS: localhost,127.0.0.1
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python manage.py test
      - run: python manage.py spectacular --validate

  microservice-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth_microservice
          - geo_microservice
          - market_microservice
          - notifications_microservice
          - payment_microservice
          - support_microservice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ${{ matrix.service }}/requirements.txt
      - run: cd ${{ matrix.service }} && pytest

  dependency-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        requirements:
          - requirements.txt
          - auth_microservice/requirements.txt
          - geo_microservice/requirements.txt
          - market_microservice/requirements.txt
          - notifications_microservice/requirements.txt
          - payment_microservice/requirements.txt
          - support_microservice/requirements.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r ${{ matrix.requirements }}
